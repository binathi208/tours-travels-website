<html>
<head>
    <title>Contact Us</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header class="header">
    <h1>Contact Aaradhya Tours & Travels</h1>
</header>

<section class="packages">
    <h2>Send Enquiry</h2>

    <form method="post">
        <input type="text" name="name" placeholder="Your Name" required><br><br>
        <input type="text" name="phone" placeholder="Phone Number" required><br><br>
        <input type="text" name="destination" value="{{ destination }}" placeholder="Destination" readonly><br><br>
        <textarea name="message" placeholder="Your Message"></textarea><br><br>
        <button type="submit">Send Enquiry</button>
    </form>
</section>

<footer class="footer">
    <p>📞 Call / WhatsApp: 9000021487</p>
</footer>

</body>
</html>
